name: Automated Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scrapers
        run: |
          python scraper.py
          python chart_scraper.py

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          echo '--- Workspace listing ---'
          ls -la
          echo '--- Git status ---'
          git status --porcelain --untracked-files=all || true
          echo '--- Results preview (first 200 chars) ---'
          head -c 200 results.json || echo 'results.json missing'
          echo '\n--- Charts preview (first 200 chars) ---'
          head -c 200 monthly_charts.json || echo 'monthly_charts.json missing'

          git add -f results.json monthly_charts.json all_charts.json

          if git diff --staged --quiet; then
            echo 'No changes to commit.'
          else
              UPDATED_RESULTS=$(python -c "import json,sys; d=json.load(open('results.json')); print(d.get('updated_at') or d.get('last_updated') or '')") || true

              SOURCE_RESULTS=$(python -c "import json,sys; d=json.load(open('results.json')); print(d.get('source') or '')") || true

              UPDATED_CHARTS=$(python -c "import json,sys; d=json.load(open('monthly_charts.json')); print(d.get('updated_at') or d.get('last_updated') or '')") || true

              SOURCE_CHARTS=$(python -c "import json,sys; d=json.load(open('monthly_charts.json')); print(d.get('source') or '')") || true

            COMMIT_MSG="Auto-update: results=${UPDATED_RESULTS:-unknown} charts=${UPDATED_CHARTS:-unknown} src_results=${SOURCE_RESULTS:-unknown} src_charts=${SOURCE_CHARTS:-unknown} [skip ci]"
            echo "Committing: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push the fresh JSON straight to the website so it does not wait for
      # raw.githubusercontent.com's ~5 minute CDN cache. Never fails the job:
      # if the site is down, it falls back to fetching from GitHub.
      - name: Push data to website
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          PSK_PUSH_TOKEN: ${{ secrets.PSK_PUSH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          files = {"results": "results.json", "monthly_charts": "monthly_charts.json", "all_charts": "all_charts.json"}
          json.dump({k: json.load(open(f)) for k, f in files.items()}, open("payload.json", "w"), ensure_ascii=False)
          PY
          for i in 1 2 3; do
            code=$(curl -s -o resp.txt -w '%{http_code}' -m 40 -X POST \
              -H "X-PSK-Token: $PSK_PUSH_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @payload.json https://patnasattaking.com/wp-json/psk/v1/feed) || code=000
            echo "attempt $i: HTTP $code $(head -c 300 resp.txt 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Website push failed; site will fall back to fetching from GitHub"
